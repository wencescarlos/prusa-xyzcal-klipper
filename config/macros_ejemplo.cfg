# Ejemplos opcionales de configuración relacionada. Adáptalos a tu máquina.

# --- G28 sobre el primer círculo (seguro incluso sin lámina) ---
# En Klipper home_xy_position es la posición de la BOQUILLA.
#[safe_z_home]
#home_xy_position: 12,18
#z_hop: 15

# --- z_tilt midiendo sobre los dos primeros círculos ---
# Los puntos de z_tilt también son posiciones de la boquilla.
#[z_tilt]
#points:
#    12,18
#    220,18

# --- Homing doble de X e Y ---
# Con homing sensorless NO uses homing_retract_dist distinto de 0 (el pin
# DIAG sigue activo y Klipper da "Endstop still triggered after retract").
# Para golpear dos veces, repite G28 en una macro y llámala en PRINT_START:
[gcode_macro HOME_DOBLE]
gcode:
  G28 X Y
  G28 X Y
  G28 Z
