# prusa_xyzcal -- sección de ejemplo para printer.cfg
# Copia este archivo a la carpeta de tu configuración (junto a printer.cfg) y
# añade en printer.cfg:   [include prusa_xyzcal.cfg]
# o pega su contenido directamente.
#
# Requisitos en tu printer.cfg:  [probe] (PINDA), [skew_correction] (solo para
# XYZCAL_APPLY) y, para XYZCAL_MAGNETS, [bed_mesh].

[prusa_xyzcal]
# Posición de la BOQUILLA (coordenadas Klipper) cuando el PINDA está sobre el
# primer círculo (frontal izquierdo). Con x_offset 23 / y_offset 5 en [probe].
first_point_x: 12.0
first_point_y: 18.0
# Separación REAL de los círculos en la cama MK3. No pongas aquí los valores
# medidos o perderás la información de escala.
dot_spacing_x: 208.0
dot_spacing_y: 192.0
# Altura segura desde la que se empieza a bajar y límite inferior de bajada.
# OJO: la calibración se hace SIN lámina. Sin lámina el PINDA apenas detecta
# fuera de los círculos y la boquilla puede tocar la cama antes de que se
# active. z_floor debe quedar POR ENCIMA de la Z a la que la boquilla toca la
# cama sin lámina (ver nozzle_contact_z y "Parte 3" del README).
z_start: 3.0
z_floor: 1.0
# Z a la que la boquilla toca la cama SIN lámina, medida con un papel tras
# G28 sobre el círculo 1 (README, Parte 3). Muy recomendable: ninguna bajada
# pasa de nozzle_contact_z + min_clearance, aunque z_floor sea más bajo, y si
# el PINDA está demasiado alto el módulo para con un error en vez de
# arrastrar la boquilla por la cama.
#nozzle_contact_z: 1.25
#min_clearance: 0.15

# --- Opcionales (valores por defecto) ---
# Posiciones exactas de los círculos (salida de XYZCAL_LOCATE); sustituyen a
# las calculadas con first_point_* y dot_spacing_*:
#point1: 11.28, 17.80
#point2: 218.84, 18.49
#point3: 218.62, 210.12
#point4: 11.08, 209.47
#sensor_reads: 1        # sube a 3 si el sensor da ruido
#settle_time: 0.02
#z_coarse_step: 0.25
#scan_lower: 0.1
#edge_span: 16.0
#iterations: 3
#coarse_step: 2.0
#coarse_window: 0.3     # búsqueda gruesa: los vecinos no bajan más de esto
                        # por debajo de la mejor Z de disparo ya medida
#travel_speed: 100
#scan_speed: 30
#z_speed: 10
