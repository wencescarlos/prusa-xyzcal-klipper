<svg xmlns="http://www.w3.org/2000/svg" width="1025" height="660" viewBox="0 0 1025 660" role="img" aria-label="Disposición de los puntos de calibración en la cama" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1025" height="660" fill="#ffffff" stroke="#cbd2d9" rx="10"/><text x="20.0" y="32.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" >Cama MK3: puntos de calibración y posiciones usadas por el módulo</text><rect x="70.0" y="60.0" width="625.0" height="550.0" fill="#f5f7fa" stroke="#52606d"/><rect x="157.5" y="115.0" width="512.5" height="480.0" fill="none" stroke="#15803d" stroke-dasharray="6 4"/><text x="162.5" y="131.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="400" >área de [bed_mesh] (mesh_min / mesh_max)</text><polygon points="100.0,565.0 620.0,565.0 620.0,85.0 100.0,85.0" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="100.0" cy="565.0" r="11.0" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/><circle cx="100.0" cy="565.0" r="2.5" fill="#d97706"/><text x="114.0" y="589.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700" >P1 (12, 18)</text><circle cx="620.0" cy="565.0" r="11.0" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/><circle cx="620.0" cy="565.0" r="2.5" fill="#d97706"/><text x="606.0" y="589.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="end" font-weight="700" >P2 (220, 18)</text><circle cx="620.0" cy="85.0" r="11.0" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/><circle cx="620.0" cy="85.0" r="2.5" fill="#2563eb"/><text x="606.0" y="75.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="end" font-weight="700" >P3 (220, 210)</text><circle cx="100.0" cy="85.0" r="11.0" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/><circle cx="100.0" cy="85.0" r="2.5" fill="#2563eb"/><text x="114.0" y="75.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700" >P4 (12, 210)</text><text x="382.5" y="335.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="400" >XYZCAL_CALIBRATE mide estos 4 círculos</text><text x="382.5" y="353.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >(deriva el skew X-Y y la escala de los ejes)</text><text x="382.5" y="628.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >frente de la impresora</text><text x="70.0" y="628.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="400" >X=0</text><text x="695.0" y="628.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="end" font-weight="400" >X=250</text><text x="64.0" y="64.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="end" font-weight="400" >Y=220</text><text x="64.0" y="610.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="end" font-weight="400" >Y=0</text><circle cx="725" cy="100" r="9" fill="#d97706" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/><text x="743.0" y="99.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" >P1 y P2: G28 (safe_z_home en P1)</text><text x="743.0" y="115.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" >y puntos de z_tilt</text><circle cx="725" cy="150" r="9" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2"/><text x="743.0" y="154.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" >P3 y P4: solo calibración</text><line x1="717" y1="190" x2="733" y2="190" stroke="#15803d" stroke-dasharray="6 4"/><text x="743.0" y="194.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400" >área del mallado</text><text x="717.0" y="250.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >Coordenadas de BOQUILLA (Klipper).</text><text x="717.0" y="266.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >Con el PINDA sobre el círculo,</text><text x="717.0" y="282.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >la boquilla está en (círculo - 23, 5)</text><text x="717.0" y="298.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >según x_offset / y_offset de [probe].</text><text x="717.0" y="330.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >Círculo real: radio ~3.2 mm.</text></svg>