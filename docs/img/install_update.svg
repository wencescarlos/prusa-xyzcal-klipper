<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Instalación y actualización" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1000" height="380" fill="#ffffff" stroke="#cbd2d9" rx="10"/><text x="20.0" y="32.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" >Instalación y actualización automática con Moonraker</text><rect x="30" y="70" width="180" height="90" rx="10" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2"/><text x="120.0" y="102.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="700" >GitHub</text><text x="120.0" y="126.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >tu repositorio</text><text x="120.0" y="143.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >prusa-xyzcal-klipper</text><rect x="280" y="70" width="180" height="90" rx="10" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/><text x="370.0" y="102.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="700" >Raspberry Pi</text><text x="370.0" y="126.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >~/prusa-xyzcal-klipper</text><text x="370.0" y="143.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >(git clone)</text><rect x="530" y="70" width="180" height="90" rx="10" fill="#15803d" fill-opacity="0.10" stroke="#15803d" stroke-width="2"/><text x="620.0" y="102.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="700" >~/klipper</text><text x="620.0" y="126.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >klippy/extras/</text><text x="620.0" y="143.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >prusa_xyzcal.py (enlace)</text><rect x="780" y="70" width="180" height="90" rx="10" fill="#d97706" fill-opacity="0.10" stroke="#d97706" stroke-width="2"/><text x="870.0" y="102.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700" >Klipper</text><text x="870.0" y="126.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >FIRMWARE_RESTART</text><text x="870.0" y="143.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >carga el módulo</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#52606d"/></marker></defs><path d="M210 115 L278 115" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/><text x="245.0" y="104.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="400" >clone</text><path d="M460 115 L528 115" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/><text x="495.0" y="104.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="400" >install.sh</text><path d="M710 115 L778 115" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/><text x="745.0" y="104.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="400" >restart</text><text x="20.0" y="205.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="700" >Actualizar después (Mainsail / Fluidd)</text><text x="30.0" y="232.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >1  Haces cambios y los subes a GitHub (git push).</text><text x="30.0" y="256.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >2  En la interfaz web, pestaña Máquina → Actualizaciones, aparece «prusa_xyzcal».</text><text x="30.0" y="280.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >3  Pulsas Actualizar: Moonraker hace git pull, ejecuta install.sh y reinicia Klipper.</text><text x="20.0" y="325.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#52606d" text-anchor="start" font-weight="400" >El enlace simbólico hace que Klipper use siempre la versión del repositorio:</text><text x="20.0" y="345.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#52606d" text-anchor="start" font-weight="400" >no hay que copiar el archivo a mano después de cada actualización.</text></svg>