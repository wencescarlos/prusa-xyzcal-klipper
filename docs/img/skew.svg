<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-label="Skew X-Y"><rect width="860" height="440" fill="#ffffff" stroke="#cbd2d9" rx="10"/><text x="20.0" y="32.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" >Qué mide el skew X-Y y cómo se corrige</text><polygon points="90.0,380.0 370.0,380.0 370.0,120.0 90.0,120.0" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="6 5"/><polygon points="90.0,380.0 370.0,380.0 410.0,120.0 130.0,120.0" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="2.5"/><circle cx="90.0" cy="380.0" r="6" fill="#d97706"/><circle cx="370.0" cy="380.0" r="6" fill="#d97706"/><circle cx="410.0" cy="120.0" r="6" fill="#d97706"/><circle cx="130.0" cy="120.0" r="6" fill="#d97706"/><text x="82.0" y="400.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="end" font-weight="700" >P1</text><text x="378.0" y="400.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700" >P2</text><text x="418.0" y="112.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700" >P3</text><text x="122.0" y="112.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="end" font-weight="700" >P4</text><path d="M90.0 270.0 A 110 110 0 0 1 106.7 271.3" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="116.0" y="280.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#b91c1c" text-anchor="start" font-weight="700" >δ</text><text x="490.0" y="90.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#52606d" text-anchor="start" font-weight="400" >Línea discontinua: cama ideal (90°)</text><text x="490.0" y="112.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="400" >Naranja: puntos medidos con el PINDA</text><text x="490.0" y="160.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="700" >Ejemplo real medido en una MK3:</text><text x="490.0" y="186.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400" >δ = 0.1305°  (leve; < 0.12° es perfecto)</text><text x="490.0" y="208.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400" >xy_skew equivalente = -0.00228</text><text x="490.0" y="230.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#52606d" text-anchor="start" font-weight="400" >Perfil CaliLantern (pieza impresa):</text><text x="490.0" y="252.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#52606d" text-anchor="start" font-weight="400" >xy_skew = -0.00243</text><text x="490.0" y="274.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="400" >Diferencia entre ambos: 0.009°</text><text x="490.0" y="320.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="700" >Klipper corrige con [skew_correction]:</text><text x="490.0" y="342.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#7c3aed" text-anchor="start" font-weight="700" font-family="Consolas,Menlo,monospace">XYZCAL_APPLY SAVE=pinda_skew</text><text x="490.0" y="364.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" font-family="Consolas,Menlo,monospace">SKEW_PROFILE LOAD=pinda_skew  (en PRINT_START)</text><text x="20.0" y="424.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="400" >Inclinación exagerada para que se vea.</text></svg>