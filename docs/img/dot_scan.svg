<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Búsqueda del centro de un círculo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="860" height="400" fill="#ffffff" stroke="#cbd2d9" rx="10"/><text x="20.0" y="32.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1f2933" text-anchor="start" font-weight="700" >Cómo localiza el centro de un círculo</text><circle cx="230" cy="220" r="90" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5"/><line x1="100" y1="220" x2="360" y2="220" stroke="#52606d" stroke-dasharray="5 4"/><line x1="230" y1="90" x2="230" y2="350" stroke="#52606d" stroke-dasharray="5 4"/><circle cx="320" cy="220" r="5" fill="#d97706"/><text x="328.0" y="210.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700" >borde X+</text><circle cx="140" cy="220" r="5" fill="#d97706"/><text x="132.0" y="210.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="end" font-weight="700" >borde X-</text><circle cx="230" cy="130" r="5" fill="#d97706"/><text x="240.0" y="128.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700" >borde Y+</text><circle cx="230" cy="310" r="5" fill="#d97706"/><text x="240.0" y="324.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700" >borde Y-</text><circle cx="230" cy="220" r="5" fill="#15803d"/><text x="240.0" y="238.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700" >centro</text><text x="230.0" y="370.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="400" >radio ~ 3.2 mm (ejemplo real)</text><text x="480.0" y="90.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >1  Baja Z hasta el primer contacto (z_hit)</text><text x="480.0" y="116.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >2  Sube a z_hit - 0.1 mm (scan_lower)</text><text x="480.0" y="142.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >3  Desde el centro, recorre X+ y X- y busca</text><text x="480.0" y="168.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >     el borde por bisección (re-armando en el</text><text x="480.0" y="194.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >     centro antes de cada prueba: histéresis)</text><text x="480.0" y="220.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >4  Centro X = media de los bordes; igual en Y</text><text x="480.0" y="246.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >5  Repite 3 iteraciones centrando; promedia</text><text x="480.0" y="272.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#1f2933" text-anchor="start" font-weight="400" >     las dos últimas (dispersión ~0.01 mm)</text><text x="480.0" y="330.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >Se consulta el sensor en pasos pequeños (como</text><text x="480.0" y="348.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="400" >QUERY_PROBE); no se usa parada por hardware.</text></svg>